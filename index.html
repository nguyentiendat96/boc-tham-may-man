<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bốc thăm may mắn — Tiến Đạt &amp; Mỹ Như</title>
<style>
  :root{
    --gold:#ffd76e;
    --gold-deep:#e9a92f;
    --ink:#4a2200;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  html{ background:#0d0618; overflow:hidden; }
  body{
    font-family:'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background-color:#0d0618;
    background-image: radial-gradient(1200px 800px at 50% -10%, #451547 0%, #241035 55%, #0d0618 100%);
    color:#fff; overflow:hidden; user-select:none;
  }
  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  .wrap{
    position:relative; z-index:10; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:2.4vh 2vw;
  }
  header{ text-align:center; }
  .couple{
    font-size:clamp(16px,2.4vh,30px); letter-spacing:.4em; text-transform:uppercase;
    color:#f3d9a4; opacity:.9;
  }
  .title{
    margin-top:.4vh;
    font-size:clamp(26px,5.6vh,64px); font-weight:800; letter-spacing:.14em;
    color:var(--gold); text-shadow:0 0 30px rgba(255,200,80,.3);
  }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .title{
      background:linear-gradient(180deg,#fff3cf,#ffd76e 55%,#e9a92f);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:none;
      filter:drop-shadow(0 0 30px rgba(255,200,80,.25));
    }
  }
  main{ flex:1; display:flex; align-items:center; justify-content:center; width:100%; }
  #number{
    display:flex; align-items:center; justify-content:center; gap:.05em;
    font-weight:900; font-variant-numeric:tabular-nums;
    font-size:clamp(120px, 34vh, 440px); line-height:1;
    transition:transform .25s ease, opacity .3s ease, font-size .3s ease;
  }
  #number .d{
    position:relative; display:inline-block; overflow:hidden;
    min-width:.66em; height:1em;
  }
  #number .d .strip{
    position:absolute; left:0; top:0; width:100%;
    will-change:transform;
  }
  #number .d .cell{
    display:flex; align-items:center; justify-content:center;
    height:1em; line-height:1;
    color:rgba(255,215,110,.45); text-shadow:none;
    transition:color .35s ease, text-shadow .35s ease;
  }
  #number .d.dim .cell{ color:rgba(255,215,110,.16); }
  #number .d.lit .cell{
    color:var(--gold);
    text-shadow:0 0 30px rgba(255,215,110,.5), 0 0 120px rgba(255,160,40,.3);
  }
  #number.idle{ opacity:.3; font-size:clamp(70px,16vh,200px); font-weight:600; }
  #number.reveal{ animation:pop .65s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop{ 0%{transform:scale(.55);} 60%{transform:scale(1.12);} 100%{transform:scale(1);} }

  footer{ display:flex; flex-direction:column; align-items:center; gap:1.4vh; padding-bottom:.6vh; }
  #spin{
    font:inherit; font-weight:800; font-size:clamp(20px,4vh,42px);
    letter-spacing:.1em; padding:.5em 1.7em; border:none; border-radius:999px; cursor:pointer;
    color:var(--ink); background:linear-gradient(180deg,#ffe7a3,#f6b73c);
    box-shadow:0 10px 40px rgba(246,183,60,.45), inset 0 2px 0 rgba(255,255,255,.65);
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s;
  }
  #spin:hover{ transform:translateY(-2px); box-shadow:0 14px 46px rgba(246,183,60,.55), inset 0 2px 0 rgba(255,255,255,.65); }
  #spin:active{ transform:translateY(1px) scale(.99); }
  #spin:disabled{ opacity:.45; cursor:default; transform:none; }

  .meta{ display:flex; gap:2.4em; font-size:clamp(12px,1.8vh,20px); color:#d8c9ee; opacity:.85; }

  .controls{
    display:flex; flex-wrap:wrap; gap:.7em; align-items:center; justify-content:center;
    opacity:.5; transition:opacity .25s; font-size:clamp(11px,1.5vh,16px);
  }
  .controls:hover{ opacity:1; }
  .controls.hidden{ display:none; }
  .controls button, .controls input{
    font:inherit; color:#e9defc; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:.45em .8em;
  }
  .controls button{ cursor:pointer; }
  .controls button:hover{ background:rgba(255,255,255,.16); }
  .controls input{ width:4.6em; text-align:center; }
  .controls input::-webkit-outer-spin-button,
  .controls input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .controls input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  .controls label{ display:inline-flex; gap:.5em; align-items:center; }

  #history{
    position:fixed; top:1.4vh; right:1vw; z-index:20; max-width:24vw;
    display:flex; flex-direction:column; gap:.5vh; align-items:flex-end; opacity:.95;
  }
  #history .h-title{ font-size:clamp(10px,1.4vh,14px); letter-spacing:.18em; text-transform:uppercase; color:#cbb8e8; }
  #history .chips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
  .chip{
    display:inline-flex; align-items:center; gap:.35em;
    background:rgba(255,215,110,.12); border:1px solid rgba(255,215,110,.4); color:#ffe6a8;
    border-radius:999px; padding:.2em .7em; font-weight:700; font-size:clamp(12px,1.6vh,18px);
  }
  .chip button{ all:unset; cursor:pointer; color:#ffb3b3; font-weight:900; padding:0 .15em; }
  .chip button:hover{ color:#ff6b6b; }

  .hint{
    position:fixed; left:1vw; bottom:1vh; z-index:20;
    font-size:clamp(10px,1.3vh,13px); color:#8f7fb0; opacity:.75;
  }
  #musicHint{
    position:fixed; top:1.2vh; left:1vw; z-index:20; display:none;
    font-size:clamp(11px,1.5vh,16px); color:#e6d7ff; opacity:.8;
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<!-- Nhạc: "Melodia dla Zuzi" — Marek & Wacek (nhạc hiệu xổ số kiến thiết, dùng cho tiệc riêng tư) -->
<audio id="music" loop preload="auto" src="music.mp3"></audio>

<div class="wrap">
  <header>
    <div class="couple">Tiến Đạt &amp; Mỹ Như · 26.09.2026</div>
    <div class="title">BỐC THĂM MAY MẮN</div>
  </header>

  <main><div id="number" class="idle"></div></main>

  <footer>
    <button id="spin">QUAY SỐ</button>
    <div class="meta">
      <span id="left"></span>
      <span id="drawnCount"></span>
    </div>
    <div class="controls" id="controls">
      <button id="soundBtn">Âm thanh</button>
      <button id="fsBtn">Toàn màn hình</button>
      <label>Số tối đa <input id="maxInput" type="number" min="1" max="9999" value="500" /></label>
      <label>Số lượt quay <input id="limitInput" type="number" min="1" max="99" value="5" /></label>
      <button id="resetBtn">Chơi lại từ đầu</button>
    </div>
  </footer>
</div>

<div id="history" style="display:none">
  <div class="h-title">Đã trúng</div>
  <div class="chips" id="chips"></div>
</div>

<div class="hint">Space = Quay · F = Toàn màn hình · H = Ẩn/hiện lịch sử · C = Ẩn/hiện điều khiển</div>
<div id="musicHint">♪ Bấm vào màn hình để bật nhạc</div>

<script>
(function(){
  'use strict';

  // ---------- phần tử ----------
  const numberEl   = document.getElementById('number');
  const spinBtn    = document.getElementById('spin');
  const leftEl     = document.getElementById('left');
  const countEl    = document.getElementById('drawnCount');
  const chipsEl    = document.getElementById('chips');
  const historyEl  = document.getElementById('history');
  const controlsEl = document.getElementById('controls');
  const soundBtn   = document.getElementById('soundBtn');
  const fsBtn      = document.getElementById('fsBtn');
  const maxInput   = document.getElementById('maxInput');
  const limitInput = document.getElementById('limitInput');
  const resetBtn   = document.getElementById('resetBtn');

  // ---------- trạng thái ----------
  let max     = 500;   // tổng số vé
  let drawn   = [];    // các số đã quay (theo thứ tự)
  let limit   = 5;     // số lượt quay tối đa
  let rolling = false;
  let soundOn = true;
  let lastFinishAt = -1e9;

  const SPIN_SPEED = 11;    // tốc độ lăn khi quay (ô chữ số/giây)
  const ROLL_MS    = 2500;  // quay nhanh bao lâu trước khi chốt chữ số đầu (ms)
  const STEP_MS    = 2000;  // khoảng cách giữa các chữ số chốt (ms)
  const SETTLE_MS  = 2000;  // thời gian lăn về đích của mỗi chữ số (ms)

  const pad = () => String(max).length;             // 500 -> 3 chữ số
  const fmt = n => String(n).padStart(pad(), '0');  // 7 -> "007"
  const pool = () => {                              // các số chưa quay
    const set = new Set(drawn);
    const arr = [];
    for (let i = 1; i <= max; i++) if (!set.has(i)) arr.push(i);
    return arr;
  };

  // ---------- các ô chữ số (kiểu lăn như đồng hồ Apple) ----------
  // Ô đầu tiên chỉ lăn trong khoảng hợp lệ của max (vd max 500 -> 0..5),
  // các ô sau lăn 0..9. Chuỗi xếp trên -> dưới, lăn xuống sẽ hiện 0,1,2,...
  function cycleFor(pos){
    const maxDigit = pos === 0 ? Number(String(max)[0]) : 9;
    const cyc = [];
    for (let d = maxDigit; d >= 0; d--) cyc.push(d);
    return cyc;
  }

  let slots = [];

  function buildSlots(){
    numberEl.innerHTML = '';
    slots = [];
    for (let i = 0; i < pad(); i++){
      const d = document.createElement('span');
      d.className = 'd dim';
      const strip = document.createElement('span');
      strip.className = 'strip';
      strip.innerHTML = '<span class="cell">–</span>';
      d.appendChild(strip);
      numberEl.appendChild(d);
      const cycle = cycleFor(i);
      slots.push({
        d, strip, cycle, N: cycle.length,
        speed: SPIN_SPEED * cycle.length / 10,   // giữ tốc độ vòng quay đều nhau
        spinning: false, p: 0, litTimer: null
      });
    }
  }

  function buildSpinStrip(slot){
    let html = '';
    for (let c = 0; c < 3; c++){
      for (let i = 0; i < slot.N; i++) html += '<span class="cell">' + slot.cycle[i] + '</span>';
    }
    slot.strip.innerHTML = html;
    slot.p = Math.random() * slot.N;
    slot.strip.style.transition = 'none';
    slot.strip.style.transform = 'translateY(' + (-slot.p) + 'em)';
  }

  // chốt 1 ô về chữ số đích: lăn xuống (chữ số đi từ trên xuống) rồi dừng lại
  function settleSlot(slot, target, onDone){
    slot.spinning = false;
    const N = slot.N, cyc = slot.cycle;
    const iStart = Math.round(slot.p) % N;
    const c = cyc[iStart];                             // chữ số đang hiển thị
    const iTarget = cyc.indexOf(target);
    const extra = Math.max(N, Math.floor(15 / N) * N);
    const steps = ((iStart - iTarget + N) % N) + extra; // số ô sẽ lăn qua
    let html = '';
    for (let k = 0; k <= steps; k++){
      html += '<span class="cell">' + cyc[((iStart - steps + k) % N + N) % N] + '</span>';
    }
    slot.strip.innerHTML = html;
    slot.strip.style.transition = 'none';
    slot.strip.style.transform = 'translateY(' + (-steps) + 'em)';
    void slot.strip.offsetHeight;
    slot.strip.style.transition = 'transform ' + SETTLE_MS + 'ms cubic-bezier(.15,.85,.2,1)';
    slot.strip.style.transform = 'translateY(0)';
    slot.d.classList.remove('dim');
    clearTimeout(slot.litTimer);
    slot.litTimer = setTimeout(() => {
      slot.d.classList.add('lit');
      playDing();
      if (onDone) onDone();
    }, SETTLE_MS);
  }

  // ---------- vòng lăn ----------
  let spinRAF = null;
  let spinLastTs = 0;
  let spinLastTick = 0;

  function spinFrame(ts){
    if (!spinLastTs) spinLastTs = ts;
    const dt = Math.min(0.05, (ts - spinLastTs) / 1000);
    spinLastTs = ts;

    let any = false;
    for (const s of slots){
      if (s.spinning){
        any = true;
        s.p = (s.p - s.speed * dt + s.N) % s.N;   // lăn xuống
        s.strip.style.transform = 'translateY(' + (-s.p) + 'em)';
      }
    }
    if (ts - spinLastTick > 100){ spinLastTick = ts; playTick(); }
    spinRAF = any ? requestAnimationFrame(spinFrame) : null;
  }

  // ---------- hiển thị ----------
  function render(){
    const rest = max - drawn.length;
    leftEl.textContent  = 'Còn lại ' + rest + ' / ' + max;
    countEl.textContent = drawn.length >= limit
      ? '✓ Đã đủ ' + limit + ' lượt quay'
      : 'Lượt ' + (drawn.length + 1) + ' / ' + limit;

    chipsEl.innerHTML = '';
    drawn.forEach(n => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = fmt(n);
      const x = document.createElement('button');
      x.textContent = '✕';
      x.title = 'Trả số này về danh sách (dùng khi người trúng đã về)';
      x.addEventListener('click', () => {
        drawn = drawn.filter(d => d !== n);
        render();
      });
      chip.append(label, x);
      chipsEl.appendChild(chip);
    });

    spinBtn.disabled = rolling || drawn.length >= limit;
    historyEl.style.display = drawn.length ? 'flex' : 'none';
  }

  // ---------- âm thanh (WebAudio, không cần file ngoài) ----------
  let actx = null;
  function ensureAudio(){
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur, type, vol, delay){
    if (!soundOn || !actx) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.03, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const playTick = () => beep(880, 0.02, 'square', 0.015);
  const playDing = () => beep(740, 0.09, 'triangle', 0.045);
  const playWin  = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => beep(f, 0.3, 'triangle', 0.05, i * 0.12));
  const playBoom = () => beep(70, 0.5, 'sine', 0.06);

  // trống lăn hồi hộp (tiếng "rrrr" nền khi quay)
  let noiseBuf = null;
  function getNoiseBuffer(){
    if (noiseBuf) return noiseBuf;
    const len = Math.max(1, Math.floor(actx.sampleRate * 0.05));
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    return noiseBuf;
  }
  function drumHit(vol){
    if (!soundOn || !actx) return;
    const src = actx.createBufferSource();
    src.buffer = getNoiseBuffer();
    const f = actx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1600;
    f.Q.value = 0.9;
    const g = actx.createGain();
    g.gain.value = vol;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  }
  let rollTimer = null;
  function startRoll(){
    stopRoll();
    (function step(){
      drumHit(0.025);
      rollTimer = setTimeout(step, 65 + Math.random() * 25);
    })();
  }
  function stopRoll(){
    if (rollTimer){ clearTimeout(rollTimer); rollTimer = null; }
  }

  // ---------- nhạc nền hồi hộp (nhúng sẵn trong file, không cần mạng) ----------
  const musicEl = document.getElementById('music');
  const musicHint = document.getElementById('musicHint');
  const MUSIC_VOL = 0.20;
  let musicFade = null;
  function fadeMusic(to, ms, done){
    clearInterval(musicFade);
    const from = musicEl.volume;
    const steps = Math.max(1, Math.round(ms / 50));
    let i = 0;
    musicFade = setInterval(() => {
      i++;
      musicEl.volume = Math.min(1, Math.max(0, from + (to - from) * i / steps));
      if (i >= steps){
        clearInterval(musicFade);
        musicFade = null;
        if (done) done();
      }
    }, 50);
  }
  function showMusicHint(){ musicHint.style.display = 'block'; }
  function hideMusicHint(){ musicHint.style.display = 'none'; }
  function startMusic(){
    if (!soundOn) return;
    if (!musicEl.paused) { hideMusicHint(); return; }   // đang phát rồi thì để chạy liền mạch
    try {
      musicEl.volume = 0;
      const p = musicEl.play();
      if (p && p.then){
        p.then(() => { hideMusicHint(); fadeMusic(MUSIC_VOL, 400); })
         .catch(() => { if (rolling) startRoll(); else showMusicHint(); });   // bị chặn -> gợi ý bấm
      } else {
        hideMusicHint();
        fadeMusic(MUSIC_VOL, 400);
      }
    } catch (e){
      if (rolling) startRoll();
    }
  }
  function stopMusic(){
    fadeMusic(0, 350, () => {
      try { musicEl.pause(); } catch (e){}
      musicEl.volume = 0;
    });
  }

  // ---------- pháo giấy ----------
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let rafOn = false;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function burst(){
    const colors = ['#ffd76e', '#ff5e7a', '#fff3cf', '#ff9f43', '#c084fc', '#7dd3fc'];
    for (let i = 0; i < 240; i++){
      particles.push({
        x: canvas.width / 2 + (Math.random() - 0.5) * canvas.width * 0.35,
        y: canvas.height * 0.38,
        vx: (Math.random() - 0.5) * 14,
        vy: -4 - Math.random() * 15,
        g: 0.22 + Math.random() * 0.18,
        s: 6 + Math.random() * 9,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        c: colors[(Math.random() * colors.length) | 0],
        life: 1
      });
    }
    if (!rafOn) loopConfetti();
  }
  function loopConfetti(){
    rafOn = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.vx *= 0.99; p.life -= 0.006;
    });
    particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 60);
    particles.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    if (particles.length){
      requestAnimationFrame(loopConfetti);
    } else {
      rafOn = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  // ---------- quay số ----------
  function spin(){
    if (rolling) return;
    if (performance.now() - lastFinishAt < 600) return;  // tránh kích hoạt lặp
    if (drawn.length >= limit) return;                   // đã đủ số lượt quay
    const arr = pool();
    if (!arr.length){
      alert('Tất cả các số đã được quay!');
      return;
    }
    ensureAudio();

    rolling = true;
    spinBtn.disabled = true;
    numberEl.classList.remove('idle', 'reveal');

    const winner = arr[(Math.random() * arr.length) | 0];
    const winnerStr = fmt(winner);

    // tất cả các ô quay tít + trống lăn hồi hộp
    slots.forEach(s => {
      s.d.classList.remove('lit', 'dim');
      buildSpinStrip(s);
      s.spinning = true;
    });
    spinLastTs = 0;
    if (!spinRAF) spinRAF = requestAnimationFrame(spinFrame);
    playBoom();
    startMusic();

    let finished = false;
    function finishOnce(){
      if (finished) return;
      finished = true;
      finish(winner);
    }

    // chốt từng chữ số, từ phải sang trái (lăn từ trên xuống rồi dừng)
    let k = winnerStr.length - 1;
    let settledCount = 0;
    setTimeout(function settleNext(){
      settleSlot(slots[k], Number(winnerStr[k]), () => {
        settledCount++;
        if (settledCount === winnerStr.length) finishOnce();
      });
      k--;
      if (k >= 0) setTimeout(settleNext, STEP_MS);
    }, ROLL_MS);

    // chốt an toàn: có trục trặc gì cũng tự kết thúc, không bao giờ bị kẹt
    setTimeout(finishOnce, ROLL_MS + winnerStr.length * STEP_MS + SETTLE_MS + 1500);
  }

  function finish(winner){
    stopRoll();
    numberEl.classList.add('reveal');
    drawn.push(winner);
    rolling = false;
    lastFinishAt = performance.now();
    render();
    burst();
    playWin();
  }

  // ---------- điều khiển ----------
  spinBtn.addEventListener('click', spin);

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    if (soundOn) { ensureAudio(); startMusic(); }
    else { stopRoll(); stopMusic(); hideMusicHint(); }
    soundBtn.textContent = soundOn ? 'Âm thanh' : 'Tắt tiếng';
  });

  fsBtn.addEventListener('click', toggleFullscreen);
  function toggleFullscreen(){
    if (document.fullscreenElement){
      document.exitFullscreen().catch(() => {});
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }

  maxInput.addEventListener('change', () => {
    if (rolling) return;
    const v = parseInt(maxInput.value, 10);
    if (!v || v < 1 || v > 9999){ maxInput.value = max; return; }
    max = v;
    drawn = drawn.filter(n => n <= max);
    buildSlots();
    numberEl.classList.remove('reveal');
    numberEl.classList.add('idle');
    render();
  });

  limitInput.addEventListener('change', () => {
    const v = parseInt(limitInput.value, 10);
    if (!v || v < 1 || v > 99){ limitInput.value = limit; return; }
    limit = v;
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (rolling) return;
    if (!confirm('Xóa toàn bộ lượt quay và chơi lại từ đầu?')) return;
    drawn = [];
    numberEl.classList.remove('reveal');
    numberEl.classList.add('idle');
    buildSlots();
    render();
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space'){ e.preventDefault(); spin(); }
    else if (e.key === 'f' || e.key === 'F'){ toggleFullscreen(); }
    else if (e.key === 'h' || e.key === 'H'){
      historyEl.style.display = (historyEl.style.display === 'none') ? 'flex' : 'none';
    }
    else if (e.key === 'c' || e.key === 'C'){
      controlsEl.classList.toggle('hidden');
    }
  });

  buildSlots();
  render();

  // thử phát nhạc ngay khi mở trang; nếu trình duyệt chặn thì bấm/chạm bất kỳ đâu là nhạc chạy
  (function(){
    try {
      musicEl.volume = 0;
      const p = musicEl.play();
      if (p && p.then){
        p.then(() => fadeMusic(MUSIC_VOL, 600)).catch(() => showMusicHint());
      } else {
        fadeMusic(MUSIC_VOL, 600);
      }
    } catch (e){
      showMusicHint();
    }
  })();
  window.addEventListener('click', function(){ startMusic(); }, { once: true });
  window.addEventListener('keydown', function(){ startMusic(); }, { once: true });
  window.addEventListener('touchstart', function(){ startMusic(); }, { once: true });
})();
</script>
</body>
</html>
